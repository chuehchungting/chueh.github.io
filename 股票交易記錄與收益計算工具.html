<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票交易記錄與收益計算</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="container mx-auto px-4 py-8 max-w-5xl">
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">股票交易記錄與收益計算</h1>
    
    <!-- 交易輸入區域 -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">新增交易紀錄</h2>
      <form id="trade-form" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">交易類型</label>
            <select id="trade-type" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
              <option value="buy">買入</option>
              <option value="sell">賣出</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">交易日期</label>
            <input type="date" id="trade-date" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" value="">
          </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">股票代號</label>
            <input type="text" id="stock-symbol" placeholder="例如: 2330" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">股票名稱</label>
            <input type="text" id="stock-name" placeholder="例如: 台積電" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
          </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">股數</label>
            <input type="number" id="quantity" placeholder="股數" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">單價 (NT$)</label>
            <input type="number" id="price" placeholder="每股價格" step="0.01" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">手續費 (NT$)</label>
            <input type="number" id="fee" placeholder="手續費" step="0.01" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
          </div>
        </div>
        
        <div class="flex justify-end">
          <button type="submit" class="px-6 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">新增交易</button>
        </div>
      </form>
    </div>
    
    <!-- 交易統計摘要 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
      <div class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-lg font-medium text-gray-700 mb-2">總投資金額</h3>
        <p id="total-investment" class="text-2xl font-bold text-blue-600">NT$ 0.00</p>
      </div>
      <div class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-lg font-medium text-gray-700 mb-2">總收益金額</h3>
        <p id="total-revenue" class="text-2xl font-bold text-green-600">NT$ 0.00</p>
      </div>
      <div class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-lg font-medium text-gray-700 mb-2">淨收益</h3>
        <p id="net-profit" class="text-2xl font-bold text-gray-800">NT$ 0.00</p>
      </div>
    </div>
    
    <!-- 圖表區域 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-lg font-medium text-gray-700 mb-4">持股分佈</h3>
        <div class="h-64">
          <canvas id="holdings-chart"></canvas>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-lg font-medium text-gray-700 mb-4">收益分析</h3>
        <div class="h-64">
          <canvas id="profit-chart"></canvas>
        </div>
      </div>
    </div>
    
    <!-- 交易記錄表格 -->
    <div class="bg-white rounded-lg shadow-md p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold text-gray-700">交易記錄</h2>
        <div class="flex space-x-2">
          <button id="export-csv" class="px-4 py-2 bg-gray-200 text-gray-700 font-medium rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2">
            匯出 CSV
          </button>
          <button id="clear-data" class="px-4 py-2 bg-red-100 text-red-700 font-medium rounded-md hover:bg-red-200 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
            清除資料
          </button>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">日期</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">交易類型</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">股票</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">股數</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">單價</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">總金額</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">手續費</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
            </tr>
          </thead>
          <tbody id="trade-records" class="bg-white divide-y divide-gray-200">
            <!-- 交易記錄將在這裡動態生成 -->
            <tr>
              <td colspan="8" class="px-6 py-4 text-center text-gray-500">尚無交易記錄</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // 初始化日期為今天
    document.getElementById('trade-date').valueAsDate = new Date();
    
    // 初始化交易記錄陣列
    let trades = JSON.parse(localStorage.getItem('stockTrades')) || [];
    
    // 初始化圖表
    let holdingsChart;
    let profitChart;
    
    // 當頁面載入完成時執行
    document.addEventListener('DOMContentLoaded', function() {
      // 渲染交易記錄
      renderTrades();
      
      // 更新統計資訊
      updateStats();
      
      // 初始化圖表
      initCharts();
      
      // 表單提交事件
      document.getElementById('trade-form').addEventListener('submit', function(e) {
        e.preventDefault();
        addTrade();
      });
      
      // 匯出 CSV 按鈕
      document.getElementById('export-csv').addEventListener('click', exportToCSV);
      
      // 清除資料按鈕
      document.getElementById('clear-data').addEventListener('click', function() {
        if (confirm('確定要清除所有交易記錄嗎？此操作無法復原。')) {
          trades = [];
          localStorage.setItem('stockTrades', JSON.stringify(trades));
          renderTrades();
          updateStats();
          updateCharts();
        }
      });
    });
    
    // 新增交易
    function addTrade() {
      const tradeType = document.getElementById('trade-type').value;
      const tradeDate = document.getElementById('trade-date').value;
      const stockSymbol = document.getElementById('stock-symbol').value.trim();
      const stockName = document.getElementById('stock-name').value.trim();
      const quantity = parseFloat(document.getElementById('quantity').value);
      const price = parseFloat(document.getElementById('price').value);
      const fee = parseFloat(document.getElementById('fee').value) || 0;
      
      // 基本驗證
      if (!stockSymbol || !stockName || isNaN(quantity) || isNaN(price) || quantity <= 0 || price <= 0) {
        alert('請填寫所有必要欄位，並確保數量和價格為正數');
        return;
      }
      
      // 計算總金額
      const totalAmount = quantity * price;
      
      // 建立交易物件
      const trade = {
        id: Date.now().toString(),
        type: tradeType,
        date: tradeDate,
        symbol: stockSymbol,
        name: stockName,
        quantity: quantity,
        price: price,
        fee: fee,
        totalAmount: totalAmount
      };
      
      // 加入交易記錄
      trades.push(trade);
      
      // 儲存到本地儲存
      localStorage.setItem('stockTrades', JSON.stringify(trades));
      
      // 重新渲染交易記錄
      renderTrades();
      
      // 更新統計資訊
      updateStats();
      
      // 更新圖表
      updateCharts();
      
      // 清除表單
      document.getElementById('stock-symbol').value = '';
      document.getElementById('stock-name').value = '';
      document.getElementById('quantity').value = '';
      document.getElementById('price').value = '';
      document.getElementById('fee').value = '';
    }
    
    // 渲染交易記錄
    function renderTrades() {
      const tableBody = document.getElementById('trade-records');
      
      // 如果沒有交易記錄
      if (trades.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="8" class="px-6 py-4 text-center text-gray-500">尚無交易記錄</td></tr>';
        return;
      }
      
      // 排序交易記錄 (最新的在前面)
      const sortedTrades = [...trades].sort((a, b) => new Date(b.date) - new Date(a.date));
      
      // 生成 HTML
      tableBody.innerHTML = sortedTrades.map(trade => `
        <tr>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${formatDate(trade.date)}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm ${trade.type === 'buy' ? 'text-red-600' : 'text-green-600'} font-medium">
            ${trade.type === 'buy' ? '買入' : '賣出'}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
            ${trade.symbol} (${trade.name})
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${formatNumber(trade.quantity)}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${formatCurrency(trade.price)}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${formatCurrency(trade.totalAmount)}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${formatCurrency(trade.fee)}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            <button onclick="deleteTrade('${trade.id}')" class="text-red-600 hover:text-red-900">刪除</button>
          </td>
        </tr>
      `).join('');
    }
    
    // 刪除交易
    function deleteTrade(id) {
      if (confirm('確定要刪除此筆交易記錄嗎？')) {
        trades = trades.filter(trade => trade.id !== id);
        localStorage.setItem('stockTrades', JSON.stringify(trades));
        renderTrades();
        updateStats();
        updateCharts();
      }
    }
    
    // 更新統計資訊
    function updateStats() {
      let totalInvestment = 0;
      let totalRevenue = 0;
      
      trades.forEach(trade => {
        if (trade.type === 'buy') {
          totalInvestment += trade.totalAmount + trade.fee;
        } else {
          totalRevenue += trade.totalAmount - trade.fee;
        }
      });
      
      const netProfit = totalRevenue - totalInvestment;
      
      document.getElementById('total-investment').textContent = `NT$ ${formatCurrency(totalInvestment)}`;
      document.getElementById('total-revenue').textContent = `NT$ ${formatCurrency(totalRevenue)}`;
      
      const netProfitElement = document.getElementById('net-profit');
      netProfitElement.textContent = `NT$ ${formatCurrency(netProfit)}`;
      netProfitElement.className = `text-2xl font-bold ${netProfit >= 0 ? 'text-green-600' : 'text-red-600'}`;
    }
    
    // 初始化圖表
    function initCharts() {
      // 持股分佈圖
      const holdingsCtx = document.getElementById('holdings-chart').getContext('2d');
      holdingsChart = new Chart(holdingsCtx, {
        type: 'pie',
        data: {
          labels: [],
          datasets: [{
            data: [],
            backgroundColor: [
              '#4299E1', '#48BB78', '#F6AD55', '#F56565', '#9F7AEA',
              '#ED64A6', '#38B2AC', '#ECC94B', '#667EEA', '#FC8181'
            ],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          legend: {
            position: 'right'
          }
        }
      });
      
      // 收益分析圖
      const profitCtx = document.getElementById('profit-chart').getContext('2d');
      profitChart = new Chart(profitCtx, {
        type: 'bar',
        data: {
          labels: [],
          datasets: [{
            label: '買入金額',
            backgroundColor: 'rgba(239, 68, 68, 0.5)',
            borderColor: 'rgba(239, 68, 68, 1)',
            borderWidth: 1,
            data: []
          }, {
            label: '賣出金額',
            backgroundColor: 'rgba(52, 211, 153, 0.5)',
            borderColor: 'rgba(52, 211, 153, 1)',
            borderWidth: 1,
            data: []
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            yAxes: [{
              ticks: {
                beginAtZero: true
              }
            }]
          }
        }
      });
      
      // 更新圖表資料
      updateCharts();
    }
    
    // 更新圖表
    function updateCharts() {
      // 計算持股分佈
      const holdings = {};
      
      trades.forEach(trade => {
        const key = `${trade.symbol} (${trade.name})`;
        
        if (!holdings[key]) {
          holdings[key] = 0;
        }
        
        if (trade.type === 'buy') {
          holdings[key] += trade.quantity;
        } else {
          holdings[key] -= trade.quantity;
        }
      });
      
      // 過濾掉持股為 0 或負數的項目
      const filteredHoldings = Object.entries(holdings)
        .filter(([_, quantity]) => quantity > 0)
        .reduce((obj, [key, value]) => {
          obj[key] = value;
          return obj;
        }, {});
      
      // 更新持股分佈圖
      holdingsChart.data.labels = Object.keys(filteredHoldings);
      holdingsChart.data.datasets[0].data = Object.values(filteredHoldings);
      holdingsChart.update();
      
      // 計算每支股票的買入和賣出金額
      const stockStats = {};
      
      trades.forEach(trade => {
        const key = `${trade.symbol} (${trade.name})`;
        
        if (!stockStats[key]) {
          stockStats[key] = { buy: 0, sell: 0 };
        }
        
        if (trade.type === 'buy') {
          stockStats[key].buy += trade.totalAmount;
        } else {
          stockStats[key].sell += trade.totalAmount;
        }
      });
      
      // 過濾掉沒有交易的股票
      const filteredStockStats = Object.entries(stockStats)
        .filter(([_, { buy, sell }]) => buy > 0 || sell > 0)
        .reduce((obj, [key, value]) => {
          obj[key] = value;
          return obj;
        }, {});
      
      // 更新收益分析圖
      profitChart.data.labels = Object.keys(filteredStockStats);
      profitChart.data.datasets[0].data = Object.values(filteredStockStats).map(stat => stat.buy);
      profitChart.data.datasets[1].data = Object.values(filteredStockStats).map(stat => stat.sell);
      profitChart.update();
    }
    
    // 匯出 CSV
    function exportToCSV() {
      if (trades.length === 0) {
        alert('沒有交易記錄可供匯出');
        return;
      }
      
      // 排序交易記錄 (按日期排序)
      const sortedTrades = [...trades].sort((a, b) => new Date(a.date) - new Date(b.date));
      
      // CSV 標題
      const headers = ['日期', '交易類型', '股票代號', '股票名稱', '股數', '單價', '總金額', '手續費'];
      
      // 轉換資料為 CSV 格式
      const csvContent = [
        headers.join(','),
        ...sortedTrades.map(trade => [
          trade.date,
          trade.type === 'buy' ? '買入' : '賣出',
          trade.symbol,
          trade.name,
          trade.quantity,
          trade.price,
          trade.totalAmount,
          trade.fee
        ].join(','))
      ].join('\n');
      
      // 建立下載連結
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `股票交易記錄_${formatDateForFilename(new Date())}.csv`);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
    
    // 格式化日期
    function formatDate(dateString) {
      const date = new Date(dateString);
      return `${date.getFullYear()}/${(date.getMonth() + 1).toString().padStart(2, '0')}/${date.getDate().toString().padStart(2, '0')}`;
    }
    
    // 格式化日期為檔名
    function formatDateForFilename(date) {
      return `${date.getFullYear()}${(date.getMonth() + 1).toString().padStart(2, '0')}${date.getDate().toString().padStart(2, '0')}`;
    }
    
    // 格式化數字
    function formatNumber(number) {
      return number.toLocaleString('zh-TW');
    }
    
    // 格式化貨幣
    function formatCurrency(number) {
      return number.toLocaleString('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
  </script>
</body>
</html>
